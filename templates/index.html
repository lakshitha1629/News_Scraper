<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Scraper</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;700&display=swap');
        body {
            font-family: 'Noto Sans Sinhala', sans-serif;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
        form {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        label {
            margin-right: 10px;
            align-self: center;
        }
        input[type="date"] {
            padding: 5px;
            margin-right: 10px;
        }
        button {
            background-color: #0056b3;
            color: #fff;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background-color: #003d80;
        }
        .articles {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        .card {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 30%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .card h2 {
            font-size: 1.2em;
            margin: 10px;
            color: #0056b3;
        }
        .card p {
            font-size: 0.9em;
            margin: 0 10px 10px 10px;
            flex-grow: 1;
        }
        .card .button-group {
            display: flex;
            justify-content: space-around;
            padding: 10px;
            background-color: #f4f4f9;
            border-top: 1px solid #e0e0e0;
        }
        .card .button-group button {
            background-color: #0056b3;
            color: #fff;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 5px;
            display: flex;
            align-items: center;
        }
        .card .button-group button:hover {
            background-color: #003d80;
        }
        .card .button-group button i {
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>News Scraper</h1>
        <form action="/scrape/" method="post">
            <label for="date">Enter Date:</label>
            <input type="date" id="date" name="date" required>
            <button type="submit">Scrape</button>
        </form>
        <div class="articles">
            {% for article in articles %}
                <div class="card">
                    <img src="{{ article.img_url }}" alt="Image not available">
                    <h2>{{ article.header_text }}</h2>
                    <p>{{ article.details_text }}</p>
                    <div class="button-group">
                        <button onclick="copyText('{{ article.header_text | escapejs }}')">
                            <i class="fas fa-copy"></i> Copy Header
                        </button>
                        <button onclick="copyText('{{ article.details_text | escapejs }}')">
                            <i class="fas fa-copy"></i> Copy Description
                        </button>
                        <button onclick="copyText('{{ article.img_url | escapejs }}')">
                            <i class="fas fa-link"></i> Copy Image URL
                        </button>
                        <button onclick="downloadImage('{{ article.img_url | escapejs }}')">
                            <i class="fas fa-download"></i> Download Image
                        </button>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>
    <script src="https://kit.fontawesome.com/a076d05399.js"></script>
    <script>
        function copyText(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            alert('Copied to clipboard!');
        }

        function downloadImage(imgUrl) {
            const link = document.createElement('a');
            link.href = imgUrl;
            link.download = imgUrl.split('/').pop();
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
