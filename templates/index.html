<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Scraper</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>News Scraper</h1>
        <form action="/scrape/" method="post">
            <label for="date">Enter Date:</label>
            <input type="date" id="date" name="date" required>
            <button type="submit">Scrape</button>
        </form>
        <div class="articles">
            {% for article in articles %}
                <div class="card">
                    <img src="{{ article.img_url }}" alt="Image not available">
                    <h2>{{ article.header_text }}</h2>
                    <p>{{ article.details_text }}</p>
                    <div class="buttons">
                        <button onclick="copyText('{{ article.header_text | escapejs }}')">Copy Header</button>
                        <button onclick="copyText('{{ article.details_text | escapejs }}')">Copy Description</button>
                        <button onclick="copyText('{{ article.img_url | escapejs }}')">Copy Image URL</button>
                        <button onclick="downloadImage('{{ article.img_url | escapejs }}')">Download Image</button>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>
    <script>
        function copyText(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            alert('Copied to clipboard!');
        }

        function downloadImage(imgUrl) {
            const link = document.createElement('a');
            link.href = imgUrl;
            link.download = imgUrl.split('/').pop();
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
